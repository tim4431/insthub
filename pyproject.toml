[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "insthub"
version = "0.1.0"
description = "Fast command and data exchange between instrument servers, GUIs and experiment scripts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Qt and pyqtgraph: insthub gui, insthub view and insthub.qt (pyqtgraph also works with PyQt5 or
# PySide6, if one of them is what the program imports).  matplotlib: plots for AI agents (insthub mcp).
dependencies = ["numpy>=1.24", "msgpack>=1.0", "PyQt6>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.6"]

[project.optional-dependencies]
# Everything is installed by default; these two remain so that "insthub[gui,mcp]" still installs.
gui = []
mcp = []
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/tim4431/insthub"

[project.scripts]
insthub = "insthub.cli:main"

[tool.setuptools.packages.find]
include = ["insthub*"]

[tool.setuptools.package-data]
insthub = ["insthub.svg"]   # the icon of `insthub gui`

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
